<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вопрос</title>
<style>
  :root {
    --bg-deep: #2b1320;
    --bg-glow: #4a1f35;
    --card-bg: #fff8f5;
    --accent: #e85d75;
    --accent-dark: #c8415c;
    --text-main: #3a2530;
    --yes-bg: #ff6f91;
    --no-bg: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(circle at 30% 20%, var(--bg-glow), var(--bg-deep) 70%);
    overflow: hidden;
    position: relative;
  }

  /* летающие фотки на фоне */
  .floater {
    position: absolute;
    bottom: -15%;
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  .photo-item {
    position: relative;
    overflow: visible;
  }

  .photo-item img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.4), 0 0 0 4px #fff8f5;
  }

  .corner-heart {
    position: absolute;
    font-size: 20px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: beat 1.4s ease-in-out infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-115vh) translateX(20px);
      opacity: 0;
    }
  }

  .card {
    position: relative;
    z-index: 10;
    background: var(--card-bg);
    border-radius: 28px;
    padding: 56px 48px 44px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop {
    from {
      opacity: 0;
      transform: scale(0.85) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .card::before {
    content: "";
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
  }

  .icon {
    font-size: 46px;
    margin-bottom: 14px;
    display: inline-block;
    animation: beat 1.4s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
    60% { transform: scale(1); }
  }

  h1 {
    font-size: 28px;
    color: var(--text-main);
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-bottom: 8px;
  }

  p.sub {
    font-family: 'Trebuchet MS', sans-serif;
    color: #8a6f78;
    font-size: 14px;
    margin-bottom: 32px;
    letter-spacing: 0.2px;
  }

  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  button {
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 36px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.3px;
  }

  button:hover {
    transform: translateY(-3px);
  }

  button:active {
    transform: translateY(-1px);
  }

  #introBtn {
    background: linear-gradient(135deg, var(--yes-bg), var(--accent-dark));
    color: #fff;
    box-shadow: 0 10px 24px rgba(232, 93, 117, 0.45);
  }

  #introBtn:hover {
    box-shadow: 0 14px 28px rgba(232, 93, 117, 0.55);
  }

  #yesBtn {
    background: linear-gradient(135deg, var(--yes-bg), var(--accent-dark));
    color: #fff;
    box-shadow: 0 10px 24px rgba(232, 93, 117, 0.45);
  }

  #yesBtn:hover {
    box-shadow: 0 14px 28px rgba(232, 93, 117, 0.55);
  }

  #noBtn {
    background: var(--no-bg);
    color: var(--accent-dark);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border: 2px solid #ffd6df;
  }

  #noBtn:hover {
    box-shadow: 0 8px 18px rgba(0,0,0,0.1);
  }

  #noBtn.escaping {
    position: fixed;
    transition: top 0.25s ease, left 0.25s ease, transform 0.25s ease,
                box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    z-index: 999;
    animation: glowPulse 0.8s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  #yesBtn.centered {
    position: fixed;
    transform: translate(-50%, -50%) scale(1.3);
    transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1000;
    box-shadow: 0 20px 40px rgba(232, 93, 117, 0.6);
  }
</style>
</head>
<body>

  <div class="card" id="introCard">
    <div class="icon">💌</div>
    <h1>У меня к тебе вопрос...</h1>
    <p class="sub">приготовься</p>
    <div class="buttons">
      <button id="introBtn">Какой?</button>
    </div>
  </div>

  <div class="card" id="mainCard" style="display: none;">
    <div class="icon">💗</div>
    <h1>Ты меня любишь?</h1>
    <p class="sub">выбери один из вариантов</p>
    <div class="buttons">
      <button id="yesBtn">Да</button>
      <button id="noBtn">Нет</button>
    </div>
  </div>

  <script>
    const introCard = document.getElementById('introCard');
    const mainCard = document.getElementById('mainCard');
    const introBtn = document.getElementById('introBtn');

    introBtn.addEventListener('click', () => {
      introCard.style.display = 'none';
      mainCard.style.display = 'block';
      // запускаем логику основного окна, когда оно реально появилось на экране
      initMainCard();
    });

    function initMainCard() {
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');

      // запоминаем изначальные позиции обеих кнопок (центры), пока они ещё не двигались
      const yesRectInitial = yesBtn.getBoundingClientRect();
      const noRectInitial = noBtn.getBoundingClientRect();

      const midPoint = {
        x: (yesRectInitial.left + yesRectInitial.width / 2 + noRectInitial.left + noRectInitial.width / 2) / 2,
        y: (yesRectInitial.top + yesRectInitial.height / 2 + noRectInitial.top + noRectInitial.height / 2) / 2
      };

      let noClicks = 0;
      const maxClicks = 5;

      noBtn.addEventListener('click', () => {
        noClicks++;

        // постепенно уменьшаем кнопку "Нет" с каждым нажатием
        const scale = Math.max(0, 1 - noClicks / maxClicks);

        if (noClicks >= maxClicks) {
          noBtn.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
          noBtn.style.opacity = '0';
          noBtn.style.transform = (noBtn.style.transform ? noBtn.style.transform + ' ' : '') + 'scale(0)';
          setTimeout(() => {
            noBtn.style.display = 'none';
          }, 350);

          // теперь кнопка "Да" переезжает в точку между изначальными позициями кнопок
          yesBtn.style.left = midPoint.x + 'px';
          yesBtn.style.top = midPoint.y + 'px';
          yesBtn.classList.add('centered');
          return;
        }

        // делаем кнопку зафиксированной, чтобы можно было двигать её по всему экрану
        if (!noBtn.classList.contains('escaping')) {
          const rect = noBtn.getBoundingClientRect();
          noBtn.style.left = rect.left + 'px';
          noBtn.style.top = rect.top + 'px';
          noBtn.classList.add('escaping');
        }

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;
        const padding = 20;

        const maxLeft = window.innerWidth - btnWidth - padding;
        const maxTop = window.innerHeight - btnHeight - padding;

        const randomLeft = padding + Math.random() * (maxLeft - padding);
        const randomTop = padding + Math.random() * (maxTop - padding);

        noBtn.style.left = randomLeft + 'px';
        noBtn.style.top = randomTop + 'px';
        noBtn.style.transform = `scale(${scale})`;

        // чем меньше кнопка, тем заметнее она становится: ярче цвет и сильнее свечение
        const glow = noClicks / maxClicks;
        noBtn.style.background = `linear-gradient(135deg, #ff3d71, #c8102e)`;
        noBtn.style.color = '#ffffff';
        noBtn.style.borderColor = '#ff3d71';
        noBtn.style.boxShadow = `0 0 ${16 + 40 * glow}px rgba(255, 61, 113, ${0.5 + 0.5 * glow})`;
      });
    }

    // фон: генерируем летающие фотки
    // ВАЖНО: положи свои фото в папку images/ рядом с index.html
    // и назови их 1.jpg, 2.jpg, 3.jpg ... (или поменяй список ниже под свои имена файлов)
    const photoFiles = [
      'images/1.jpg',
      'images/2.jpg',
      'images/3.jpg',
      'images/4.jpg',
      'images/5.jpg',
      'images/6.jpg'
    ];

    const cornerPositions = [
      { top: '-10px', left: '-10px' },
      { top: '-10px', right: '-10px' },
      { bottom: '-10px', left: '-10px' },
      { bottom: '-10px', right: '-10px' }
    ];

    const floatersCount = 14;

    for (let i = 0; i < floatersCount; i++) {
      const floater = document.createElement('div');
      floater.className = 'floater';
      floater.style.left = Math.random() * 90 + 'vw';
      floater.style.animationDuration = 10 + Math.random() * 10 + 's';
      floater.style.animationDelay = Math.random() * 12 + 's';

      const size = 70 + Math.random() * 50;

      const photoItem = document.createElement('div');
      photoItem.className = 'photo-item';
      photoItem.style.width = size + 'px';

      // случайный наклон влево или вправо
      const direction = Math.random() < 0.5 ? -1 : 1;
      const angle = direction * (6 + Math.random() * 14);
      photoItem.style.transform = `rotate(${angle}deg)`;

      const img = document.createElement('img');
      img.src = photoFiles[Math.floor(Math.random() * photoFiles.length)];
      img.alt = '';

      const heart = document.createElement('span');
      heart.className = 'corner-heart';
      heart.textContent = ['💗', '💕', '💓', '❤'][Math.floor(Math.random() * 4)];
      const corner = cornerPositions[Math.floor(Math.random() * cornerPositions.length)];
      Object.assign(heart.style, corner);

      photoItem.appendChild(img);
      photoItem.appendChild(heart);
      floater.appendChild(photoItem);
      document.body.appendChild(floater);
    }
  </script>

</body>
</html>
